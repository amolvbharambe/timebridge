name: Build TimeBridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TimeBridge APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Signed Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/TimeBridge.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeBridge-apk
          path: android/dist/TimeBridge.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: TimeBridge Android App v1.0.1
          body: |
            ### 📱 TimeBridge Android APK (v1.0.1)

            Download **TimeBridge.apk** below and tap it to install on your Android device.

            > ℹ️ **Installation Tip:** If you previously had a test/debug version installed, please uninstall it first so Android can install this signed production release cleanly.
          files: android/dist/TimeBridge.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
