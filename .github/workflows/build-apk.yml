name: Build TimeBridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TimeBridge APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} app/build/outputs/apk/debug/TimeBridge.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeBridge-apk
          path: android/app/build/outputs/apk/debug/TimeBridge.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TimeBridge Android App v1.0.0
          body: |
            ### 📱 TimeBridge Android APK
            Download the `TimeBridge.apk` file below and open it on your Android phone to install!
          files: android/app/build/outputs/apk/debug/TimeBridge.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
