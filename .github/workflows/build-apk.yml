name: Build TimeBridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TimeBridge APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Signed Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/TimeBridge.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeBridge-apk
          path: android/dist/TimeBridge.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: TimeBridge Android App v1.0.3
          body: |
            ### 📱 TimeBridge Android APK (v1.0.3)

            Download **TimeBridge.apk** below and tap it to install on your Android device.

            #### What's New:
            - **Reordered Top Timezones**: CST, IST, EST, GMT, UTC, plus PST (US Pacific).
            - **Dual Converter Instances**: Added a second conversion instance in the IST ⇄ CST converter for comparing two meeting/event slots side-by-side.
            - **Interactive 24-Hour Scrubber Target Switcher**: Select whether the interactive slider adjusts Slot 1 or Slot 2.
            - **AndroidX & Build Reliability**: Configured root and module `gradle.properties` for seamless builds.

            > ℹ️ **Installation Tip:** If updating from an earlier test version, you can install directly over v1.0.2 or uninstall previous versions if prompted.
          files: android/dist/TimeBridge.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
